name: Build library

# The project targets the Windows (legacy) framework, so UiPath's workflow
# compiler only runs on a Windows runner - packing on Linux fails with
# "Cannot execute Windows projects on Linux platform".
on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UIPCLI_VERSION: "25.10.22"
  UIPATH_FEED: "https://uipath.pkgs.visualstudio.com/Public.Feeds/_packaging/UiPath-Official/nuget/v3/flat2"

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Releases are cut by CI rather than by pushing a tag: bump projectVersion
      # in project.json and the first build of that version publishes the release
      # (creating the tag). Rebuilds of an already-released version produce a
      # -ci.N artifact instead, so a release is never silently overwritten.
      - name: Resolve version and release plan
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $proj = (Get-Content project.json -Raw | ConvertFrom-Json).projectVersion
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
            $release = "true"
          } else {
            $tag = "v$proj"
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            $alreadyReleased = ($LASTEXITCODE -eq 0)
            # gh exits non-zero when the release is absent, which is the normal
            # first-release case - clear it so it is not taken as step failure.
            $global:LASTEXITCODE = 0
            if ($alreadyReleased) {
              $version = "$proj-ci.${{ github.run_number }}"
              $release = "false"
            } else {
              $version = $proj
              $release = "true"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version  tag=$tag  publish-release=$release"
          exit 0

      - name: Download UiPath CLI
        shell: pwsh
        run: |
          $url = "$env:UIPATH_FEED/uipath.cli.windows/$env:UIPCLI_VERSION/uipath.cli.windows.$env:UIPCLI_VERSION.nupkg"
          Invoke-WebRequest -Uri $url -OutFile uipcli.zip
          Expand-Archive uipcli.zip -DestinationPath uipcli -Force

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          dotnet uipcli/tools/net8.0/any/uipcli.dll package pack project.json `
            -o output `
            -v "${{ steps.ver.outputs.version }}" `
            --repositoryUrl "${{ github.server_url }}/${{ github.repository }}" `
            --repositoryCommit "${{ github.sha }}" `
            --repositoryType git `
            --traceLevel Information
          if ($LASTEXITCODE -ne 0) { throw "uipcli pack failed with exit code $LASTEXITCODE" }
          $pkg = Get-ChildItem output -Filter *.nupkg
          if (-not $pkg) { throw "pack reported success but produced no .nupkg" }
          Write-Host "Built $($pkg.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: AI_SemanticSearch-${{ steps.ver.outputs.version }}
          path: output/*.nupkg
          if-no-files-found: error

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $pkg = (Get-ChildItem output/*.nupkg).FullName
          $notes = @(
            'UiPath library package for Windows targets, built from commit ' + $env:SHA + '.'
            ''
            '**Install:** download the .nupkg below, then either add its folder as a custom NuGet feed in UiPath Studio (Settings -> Manage Sources), or upload it to Orchestrator.'
            ''
            'See the [README](' + $env:REPO_URL + '#readme) for the public API, and [docs](' + $env:REPO_URL + '/tree/' + $env:SHA + '/docs) for the architecture and error-handling notes.'
          ) -join "`n"
          gh release create "${{ steps.ver.outputs.tag }}" $pkg `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SHA `
            --title "AI_SemanticSearch ${{ steps.ver.outputs.version }}" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
